<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youssef Filali | YoussefFilali.com</title>
<meta name="description" content="Youssef Filali: domain investor, digital marketer and Master student in Business Intelligence. 14 premium domain names for sale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#1A2233;--muted:#5B667A;--line:#DDE2EC;--accent:#2B45F0;--accent-ink:#fff;--tld:#8A94A8;
--display:"Sora","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--body:"Manrope","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0F192B;--surface:#16233A;--ink:#E8EEF8;--muted:#9AA9C2;--line:#25354F;--accent:#8499FF;--accent-ink:#0F192B;--tld:#6F809C}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;margin:0}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font:600 15px var(--body);padding:11px 18px;border-radius:10px;text-decoration:none;border:1px solid var(--accent);cursor:pointer;white-space:nowrap;text-align:center}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--ink);filter:none}.btn.small{font-size:14px;padding:8px 14px}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;flex-wrap:wrap}
nav b{font:700 18px var(--display)}nav .l{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
nav a{color:var(--muted);text-decoration:none;font-size:15px;font-weight:500}nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{font:600 13px var(--body);background:transparent;color:var(--muted);border:0;padding:6px 11px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{display:grid;grid-template-columns:1fr 190px;gap:40px;align-items:center;padding:48px 0 56px}
.hero h1{font-size:clamp(34px,5.6vw,58px);line-height:1.06;margin-bottom:18px}
.hero p{color:var(--muted);font-size:18px;max-width:54ch;margin:0 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero img{width:190px;height:190px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.stats{display:flex;gap:32px;flex-wrap:wrap;margin-top:32px}
.stats b{display:block;font:700 28px var(--display)}.stats span{color:var(--muted);font-size:14px}
section.sec{padding:40px 0 24px}
.sec>h2{font-size:clamp(26px,4vw,34px);margin-bottom:8px}
.sec>.lead{color:var(--muted);max-width:62ch;margin:0 0 24px}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:0 0 24px}
.chip{font:600 14px var(--body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--ink)}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{margin-bottom:40px}.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.group-head h3{font-size:20px;font-weight:600}.group-head span{color:var(--muted);font-size:14px}.group-note{color:var(--muted);font-size:15px;max-width:64ch;margin:0 0 14px}
.list,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}.list{overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 190px;gap:24px;align-items:center;padding:24px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font:600 clamp(22px,3vw,28px)/1.15 var(--display);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}.name .tld{color:var(--tld);font-weight:500}
.desc{margin:0;color:var(--muted);font-size:16px}.desc strong{color:var(--ink);font-weight:600}
.buy{display:flex;flex-direction:column;gap:8px}.price{font:600 22px var(--display)}.price.none{font-size:16px;font-weight:500;color:var(--muted)}
.card{padding:24px}.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card h3{font-size:18px;margin-bottom:6px}.card p,.card li{color:var(--muted);font-size:15.5px;margin:0}.card ul{margin:8px 0 0;padding-left:18px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 12px;margin-bottom:12px}
.project{padding:28px}.project h3{font-size:24px;margin-bottom:10px}.project>p{color:var(--muted);margin:0 0 20px;max-width:66ch}
.note{margin:18px 0 0;font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.tl .it{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line)}
.tl .it:first-child{border-top:0}.tl .when{color:var(--muted);font-size:14.5px}.tl h3{font-size:18px}.tl .where{color:var(--muted);font-size:15px;margin:2px 0 6px}.tl p{margin:0;color:var(--muted);font-size:15.5px}
.contact{border-top:1px solid var(--line);margin-top:40px;padding:48px 0 32px}.contact h2{font-size:clamp(26px,4vw,38px);margin-bottom:12px}
.contact p{color:var(--muted);max-width:52ch;margin:0 0 24px}.links{display:flex;flex-wrap:wrap;gap:12px}
footer{color:var(--muted);font-size:14px;padding:16px 0 40px}
@media(max-width:760px){body{font-size:16px}.hero{grid-template-columns:1fr;padding:24px 0 40px}.hero img{order:-1;width:120px;height:120px}
.row{grid-template-columns:1fr;gap:12px;padding:20px}.buy{flex-direction:row;flex-wrap:wrap;align-items:center}.buy .price{width:100%}
.g3,.g2{grid-template-columns:1fr}.tl .it{grid-template-columns:1fr;gap:4px}}
</style>
</head>
